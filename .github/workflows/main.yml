name: CI/CD Pipeline # 워크플로우의 이름 (GitHub Actions 대시보드에서 보이는 이름)

on:
  push: # push 이벤트가 발생했을 때 워크플로우를 실행
    branches:
      - dev # main 브랜치에 push가 발생했을 때 실행

jobs: # 워크플로우의 작업(job)들을 정의
  build-and-deploy: # 작업의 이름
    runs-on: ubuntu-latest # 작업을 실행할 runner (가상 서버) 환경 (최신 Ubuntu 버전)

    steps: # 작업 내의 단계(step)들을 정의
      - name: Checkout code # 단계 이름
        uses: actions/checkout@v3 # GitHub Action을 사용하여 코드를 저장소에서 가져옴 (checkout)

      - name: Create .env file
        run: |
          echo "NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}" >> .env
          echo "NODE_ENV=${{ secrets.NODE_ENV }}" >> .env
          echo "NEXT_PUBLIC_KAKAO_API_KEY=${{ secrets.NEXT_PUBLIC_KAKAO_API_KEY }}" >> .env
          COPY .env /app/.env

      - name: Build Docker image # 단계 이름
        run: docker build -t kipid/fitmate-fe:v0.1 . # Docker 이미지를 빌드. -t는 이미지 이름(kipid/fitmate-fe:v0.1)을 지정, .은 Dockerfile이 있는 현재 디렉토리를 의미

      - name: Push Docker image to Docker Hub # 단계 이름
        run: | # 여러 줄의 명령어를 실행
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin  # Docker Hub에 로그인. secrets에 저장된 username과 password 사용
          docker push kipid/fitmate-fe:v0.1  # Docker Hub에 빌드된 이미지를 push

      - name: Deploy to server # 단계 이름
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key ${{ secrets.SERVER_USERNAME }}@${{ secrets.SERVER_IP }}  << 'EOF'
            docker pull kipid/fitmate-fe:v0.1
            docker stop fitmate-fe-container || true
            docker rm fitmate-fe-container || true
            docker run -d -p 3001:3001 --name fitmate-fe-container --env-file /app/.env kipid/fitmate-fe:v0.1
            sleep 5  # 컨테이너 정상 실행 확인 시간 확보
            docker system prune -a
          EOF
