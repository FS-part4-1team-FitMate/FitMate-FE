name: CI/CD Pipeline # 워크플로우의 이름 (GitHub Actions 대시보드에서 보이는 이름)

on:
  push: # push 이벤트가 발생했을 때 워크플로우를 실행
    branches:
      - dev # main 브랜치에 push가 발생했을 때 실행

jobs: # 워크플로우의 작업(job)들을 정의
  build-and-deploy: # 작업의 이름
    runs-on: ubuntu-latest # 작업을 실행할 runner (가상 서버) 환경 (최신 Ubuntu 버전)

    steps: # 작업 내의 단계(step)들을 정의
      - name: Checkout code # 단계 이름
        uses: actions/checkout@v3 # GitHub Action을 사용하여 코드를 저장소에서 가져옴 (checkout)

      - name: Build Docker image # 단계 이름
        run: docker build -t kipid/fitmate-fe:v0.1 . # Docker 이미지를 빌드. -t는 이미지 이름(kipid/fitmate-fe:v0.1)을 지정, .은 Dockerfile이 있는 현재 디렉토리를 의미

      - name: Push Docker image to Docker Hub # 단계 이름
        run: | # 여러 줄의 명령어를 실행
          docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}  # Docker Hub에 로그인. secrets에 저장된 username과 password 사용
          docker push kipid/fitmate-fe:v0.1  # Docker Hub에 빌드된 이미지를 push

      - name: Deploy to server # 단계 이름
        uses: appleboy/ghaction-ssh@master # SSH를 사용하여 원격 서버에 접속하는 GitHub Action 사용
        with: # Action의 설정 값
          host: ${{ secrets.SERVER_IP }} # 서버 IP 주소 (secrets에 저장)
          username: ${{ secrets.SERVER_USERNAME }} # 서버 username (secrets에 저장)
          key: ${{ secrets.SERVER_PRIVATE_KEY }} # 서버 개인키 (secrets에 저장)
          script: | # 서버에서 실행할 명령어
            docker pull kipid/fitmate-fe:v0.1  # Docker Hub에서 이미지를 pull (가져옴)
            docker stop fitmate-fe-container || true  # 실행 중인 컨테이너를 중지. || true는 컨테이너가 없을 경우 에러를 무시
            docker rm fitmate-fe-container || true  # 컨테이너를 삭제. || true는 컨테이너가 없을 경우 에러를 무시
            docker run -d -p 3001:3001 --name fitmate-fe-container kipid/fitmate-fe:v0.1  # Docker 컨테이너를 실행. -d는 detached mode (백그라운드), -p는 포트 매핑, --name은 컨테이너 이름
